<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SISCO — Enviar Comunicado</title>
    <link rel="stylesheet" href="./index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page page-inner">
      <header class="inner-header">
        <span class="logo">SISCO</span>
        <span class="header-title">Sistema de Unidade de Conservação</span>
        <button class="btn-back" onclick="history.back()">Voltar</button>
      </header>

      <div class="form-wrap">
        <h2 class="form-page-title">Comunicação com a UA</h2>

        <div class="form-card">
          <h3 class="form-card-heading">Nova Comunicação</h3>

          <div class="form-body">
            <div class="form-left-col">
              <div class="form-group">
                <label class="form-label">Título</label>
                <input
                  type="text"
                  class="form-input"
                  id="form-titulo"
                  placeholder="Digite seu título…"
                />
              </div>
              <div class="form-group">
                <label class="form-label">Nome</label>
                <input
                  type="text"
                  class="form-input"
                  id="form-nome"
                  placeholder="Digite seu nome…"
                />
              </div>
              <div class="form-group">
                <label class="form-label">E-mail</label>
                <input
                  type="email"
                  class="form-input"
                  id="form-email"
                  placeholder="Digite seu e-mail…"
                />
              </div>
              <div class="form-group">
                <label class="form-label">Unidade de Conservação</label>
                <input
                  type="text"
                  class="form-input"
                  id="form-uc"
                  placeholder="Selecione a unidade…"
                  readonly
                />
              </div>
            </div>

            <div class="form-right-col">
              <label class="form-label">Descrição</label>
              <textarea
                class="form-textarea"
                id="form-descricao"
                placeholder="Descreva o comunicado…"
              ></textarea>
            </div>
          </div>

          <div class="form-actions">
            <button class="btn-form-submit" onclick="submitForm()">
              Enviar
            </button>
          </div>
        </div>
      </div>

      <footer>© 2026 SISCO – Sistema de Unidade de Conservação</footer>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
